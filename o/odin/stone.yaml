name        : odin
version     : "2026-10"
release     : 1
homepage    : https://github.com/odin-lang/Odin
upstreams   :
    - https://github.com/odin-lang/Odin/archive/dev-2026-10.tar.gz : f72a045c956c6fe09937d8283b9a3a69ca11197993a6cee8bdaf1ed5205e9f13
summary     : A Data-Oriented Language for Sane Software Development.
description : |
    Odin is a general-purpose programming language with distinct typing, built for high performance, modern systems, and built-in data-oriented data types. The Odin Programming Language, the C alternative for the joy of programming.
license     : 
    - Zlib
rundeps     :
    - clang # required for linking
builddeps   :
    - binary(clang++)
    - binary(llvm-config-22)
    - binary(python)
    - binary(which)
networking  : true # needed for tests
environment : |
    _odinroot="%(libdir)/%(name)"

    LLVM_CONFIG=%(bindir)/llvm-config-22
build       : |
    %make release

    vendor/cgltf/src/build_cgltf.sh
    vendor/stb/src/build_stb.sh
install     : |
    %install_dir %(installroot)/${_odinroot} %(installroot)/%(bindir)

    # The existence of these libs makes boulder pull in aarch64 deps
    rm -rf vendor/raylib/linux-arm64

    cp -apv base core vendor shared odin "%(installroot)/${_odinroot}"
    ln -srv "%(installroot)/${_odinroot}/odin" "%(installroot)/%(bindir)/odin"
check       : |
    python tests/core/download_assets.py tests/core/assets
    ./odin test tests/core/normal.odin -file -all-packages
    ./odin test tests/core/speed.odin -o:speed -file -all-packages
    ./odin test tests/vendor -all-packages
    ./odin test tests/internal -all-packages
